name: editors_pro
description: "EDITORS-PRO: Professional mobile video editor built with Flutter + Rust"
publish_to: 'none'
version: 0.1.0+1

# Phase E.7: enable Flutter's codegen for localization (.arb → AppLocalizations).
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Rust Bridge
  flutter_rust_bridge: ^2.9.0

  # FFI (Phase A.1: used by lib/src/rust/frb_generated.dart to call into
  # the C ABI exposed by engine/src/api/ffi_dispatch.rs).
  ffi: ^2.1.3

  # Database (local)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # File picking
  file_picker: ^9.2.1
  image_picker: ^1.2.4
  video_player: ^2.14.1

  # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.0

  # Permissions
  permission_handler: ^11.4.0

  # UI utilities
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # Persistence
  shared_preferences: ^2.3.4

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

  # Phase E.7: localization
  flutter_localizations:
    sdk: flutter

  # Phase E.20: Google Drive cloud sync
  # flutter_appauth handles the OAuth2 PKCE flow with Android Custom Tabs.
  # flutter_secure_storage stores the access/refresh tokens in Android Keystore.
  # http is used for Google Drive REST API calls.
  flutter_appauth: ^8.0.0+1
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logger: ^2.5.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Testing utilities
  mocktail: ^1.0.4

  # Code coverage
  coverage: ^1.9.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2
  drift_dev: ^2.22.1

flutter:
  # Phase E.7: enable Flutter's codegen for localization (.arb -> AppLocalizations).
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/svg/
    - assets/fonts/Inter-LICENSE.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
