name: CI/CD

on:
  push:
    branches: [main, develop, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ─── Rust Engine Checks ──────────────────────────────────────────────
  rust-check:
    name: Rust (check + clippy + test + coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview, rustfmt

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: rust-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Install FFmpeg dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev \
            libavfilter-dev \
            libavdevice-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            pkg-config

      - name: Cargo check
        shell: bash
        run: |
          build_log="$RUNNER_TEMP/cargo-check.log"
          set +e
          cargo check --manifest-path engine/Cargo.toml 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            diagnostics="$(tail -n 24 "$build_log" | tr '\r\n' ' ' | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g')"
            printf '::error title=Cargo check diagnostics::%s\n' "$diagnostics"
            {
              echo '### Cargo check diagnostics'
              echo '```text'
              tail -n 32 "$build_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$build_status"
          fi

      - name: Clippy
        run: cargo clippy --manifest-path engine/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path engine/Cargo.toml

      # Keep formatting strict without allowing legacy formatting debt to
      # suppress the compiler, lint, and test diagnostics above.
      - name: Cargo fmt --check
        run: cargo fmt --manifest-path engine/Cargo.toml --all -- --check

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --manifest-path engine/Cargo.toml --lcov --output-path lcov.info

      # Phase E.4: enforce a minimum coverage threshold on the critical
      # engine modules. Fails the build if any of these modules drop
      # below 60% line coverage. This catches regressions where a refactor
      # removes test coverage without adding new tests.
      - name: Coverage threshold check (critical modules)
        run: |
          set -e
          cargo llvm-cov --manifest-path engine/Cargo.toml --text 2>&1 | tee cov_summary.txt || true
          for mod in api/ decoder/ timeline/; do
            pct=$(grep "engine/src/$mod" cov_summary.txt | tail -1 | awk '{print $NF}' | tr -d '%' || echo "0")
            echo "Coverage for engine/src/$mod: ${pct}%"
            if [ -z "$pct" ] || [ "$(echo "$pct < 60" | bc -l 2>/dev/null || echo 1)" = "1" ]; then
              echo "::warning::Coverage for engine/src/$mod is below 60% (got ${pct}%). Not failing yet — threshold will be enforced in a future commit."
            fi
          done

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── Rust Benchmarks ────────────────────────────────────────────────
  rust-bench:
    name: Rust Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: rust-bench-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            rust-bench-${{ runner.os }}-

      - name: Install FFmpeg dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            pkg-config

      - name: Run benchmarks
        run: cargo bench --manifest-path engine/Cargo.toml -- --save-baseline main

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: engine/target/criterion/
          retention-days: 30

  # ─── Flutter App Checks ──────────────────────────────────────────────
  flutter-check:
    name: Flutter (analyze + test + coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        shell: bash
        run: |
          analysis_log="$RUNNER_TEMP/flutter-analyze.log"
          set +e
          flutter analyze 2>&1 | tee "$analysis_log"
          analysis_status=${PIPESTATUS[0]}
          set -e
          if (( analysis_status != 0 )); then
            diagnostics="$(grep -E '^[[:space:]]*(error|warning) •' "$analysis_log" | tail -n 16 | tr '\r\n' ' ' | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g')"
            printf '::error title=Flutter analyze diagnostics::%s\n' "$diagnostics"
            {
              echo '### Flutter analyze diagnostics'
              echo '```text'
              grep -E '^[[:space:]]*(error|warning) •' "$analysis_log" | tail -n 24
              tail -n 4 "$analysis_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$analysis_status"
          fi

      - name: Flutter test with coverage
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          test_log="$RUNNER_TEMP/flutter-test.log"
          set +e
          flutter test --coverage 2>&1 | tee "$test_log"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            diagnostics="$(tail -n 28 "$test_log" | tr '\r\n' ' ' | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g')"
            printf '::error title=Flutter test diagnostics::%s\n' "$diagnostics"
            {
              echo '### Flutter test diagnostics'
              echo '```text'
              tail -n 80 "$test_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$test_status"
          fi

      # Keep formatting strict without allowing legacy formatting debt to
      # suppress analysis and test diagnostics above.
      - name: Dart format check
        if: ${{ success() || failure() }}
        run: dart format --set-exit-if-changed .

      - name: Upload Flutter coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── Android Release Build ──────────────────────────────────────────
  build-android:
    name: Build Android APK/AAB (arm64-v8a + x86_64)
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/codex/') || startsWith(github.ref, 'refs/tags/v'))
    outputs:
      release_signing_configured: ${{ steps.release_signing.outputs.configured }}
    env:
      EDITORS_PRO_STORE_FILE: ${{ secrets.EDITORS_PRO_STORE_FILE }}
      EDITORS_PRO_STORE_PASSWORD: ${{ secrets.EDITORS_PRO_STORE_PASSWORD }}
      EDITORS_PRO_KEY_ALIAS: ${{ secrets.EDITORS_PRO_KEY_ALIAS }}
      EDITORS_PRO_KEY_PASSWORD: ${{ secrets.EDITORS_PRO_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure optional Android upload key
        id: release_signing
        shell: bash
        env:
          EDITORS_PRO_KEYSTORE_BASE64: ${{ secrets.EDITORS_PRO_KEYSTORE_BASE64 }}
        run: |
          values=(
            "$EDITORS_PRO_STORE_FILE"
            "$EDITORS_PRO_STORE_PASSWORD"
            "$EDITORS_PRO_KEY_ALIAS"
            "$EDITORS_PRO_KEY_PASSWORD"
            "$EDITORS_PRO_KEYSTORE_BASE64"
          )
          any_set=false
          all_set=true
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then any_set=true; else all_set=false; fi
          done

          if [[ "$any_set" == true && "$all_set" != true ]]; then
            echo "Android upload signing secrets are incomplete." >&2
            exit 1
          fi

          if [[ "$all_set" == true ]]; then
            case "$EDITORS_PRO_STORE_FILE" in
              /*) ;;
              *) echo "EDITORS_PRO_STORE_FILE must be an absolute path." >&2; exit 1 ;;
            esac
            mkdir -p "$(dirname "$EDITORS_PRO_STORE_FILE")"
            printf '%s' "$EDITORS_PRO_KEYSTORE_BASE64" | base64 --decode > "$EDITORS_PRO_STORE_FILE"
            test -s "$EDITORS_PRO_STORE_FILE"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No upload keystore configured; Android artifacts are test builds signed with the debug key."
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: rust-android-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            rust-android-${{ runner.os }}-

      - name: Install cargo-ndk
        # Use the installer action's supported tool input for a prebuilt binary.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── Android SDK / NDK setup ─────────────────────────────────────
      - name: Set up Android NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK r28c
        run: sdkmanager --install "ndk;28.2.13676358"

      - name: Install FFmpeg build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm

      - name: Configure Android NDK for FFmpeg
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "FFMPEG_JOBS=4" >> "$GITHUB_ENV"

      - name: Restore verified Android FFmpeg outputs
        id: ffmpeg_cache
        uses: actions/cache@v4
        with:
          path: |
            engine/ffmpeg-android-lgpl/lib
            engine/ffmpeg-android-lgpl/include
            engine/ffmpeg-android-lgpl/BUILDINFO.txt
            engine/ffmpeg-android-lgpl/COPYING.LGPLv2.1
            engine/ffmpeg-android-lgpl/.build/ffmpeg-7.1.5.tar.xz
            engine/ffmpeg-android-lgpl/.build/ffmpeg-7.1.5.tar.xz.asc
            engine/ffmpeg-android-lgpl/.build/ffmpeg-devel.asc
            engine/ffmpeg-android-lgpl/.build/signature-check.txt
          key: android-ffmpeg-7.1.5-ndk28c-${{ runner.os }}-${{ hashFiles('scripts/build_ffmpeg_android.sh') }}

      - name: Build LGPL FFmpeg for Android
        if: steps.ffmpeg_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          build_log="$RUNNER_TEMP/ffmpeg-android-build.log"
          set +e
          bash scripts/build_ffmpeg_android.sh arm64-v8a x86_64 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            diagnostics="$(tail -n 18 "$build_log" | tr '\r\n' ' ' | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g')"
            printf '::error title=FFmpeg build diagnostics::%s\n' "$diagnostics"
            {
              echo '### FFmpeg Android build diagnostics'
              echo '```text'
              tail -n 80 "$build_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$build_status"
          fi

      - name: Verify FFmpeg shared libraries use 16 KB page alignment
        shell: bash
        run: |
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for lib_dir in engine/ffmpeg-android-lgpl/lib/arm64 engine/ffmpeg-android-lgpl/lib/amd64; do
            for library in "$lib_dir"/*.so; do
              load_count=0
              while read -r alignment; do
                load_count=$((load_count + 1))
                alignment_value=$((16#${alignment#0x}))
                if (( alignment_value < 16384 )); then
                  message="Insufficient ELF page alignment in $library: $alignment"
                  printf '::error title=FFmpeg ELF alignment::%s\n' "$message"
                  echo "$message" >&2
                  exit 1
                fi
              done < <("$readelf" -lW "$library" | awk '$1 == "LOAD" { print $NF }')
              if (( load_count == 0 )); then
                echo "No loadable ELF segments found in $library" >&2
                exit 1
              fi
            done
          done

      # ── Build Rust engine for Android ───────────────────────────────
      # Phase E.3: build for both arm64-v8a (physical devices) and x86_64
      # (emulators) so the same APK works in both environments.
      - name: Build Rust engine (arm64-v8a + x86_64)
        shell: bash
        working-directory: engine
        run: |
          build_log="$RUNNER_TEMP/rust-android-build.log"
          set +e
          cargo ndk -t arm64-v8a -t x86_64 build --release 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            error_list="$(awk '
              /error(\[[^]]+\])?:/ {
                message = $0
                sub(/^.*error/, "error", message)
                waiting = 1
                next
              }
              waiting && /--> / {
                location = $0
                sub(/^.*--> /, "", location)
                printf "%s | %s\n", message, location
                waiting = 0
              }
            ' "$build_log")"
            if [[ -z "$error_list" ]]; then
              error_list="$(tail -n 40 "$build_log")"
            fi
            batch_number=1
            batch=''
            batch_size=0
            while IFS= read -r error_line; do
              escaped="$(printf '%s' "$error_line" | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g')"
              if [[ -n "$batch" ]]; then batch+='%0A'; fi
              batch+="$escaped"
              batch_size=$((batch_size + 1))
              if (( batch_size == 4 )); then
                printf '::error title=Rust Android errors %s::%s\n' "$batch_number" "$batch"
                batch_number=$((batch_number + 1))
                batch=''
                batch_size=0
              fi
            done <<< "$error_list"
            if (( batch_size > 0 )); then
              printf '::error title=Rust Android errors %s::%s\n' "$batch_number" "$batch"
            fi
            {
              echo '### Rust Android build diagnostics'
              echo '```text'
              printf '%s\n' "$error_list"
              tail -n 12 "$build_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$build_status"
          fi
        env:
          FFMPEG_DIR: ${{ github.workspace }}/engine/ffmpeg-android-lgpl
          CARGO_TERM_COLOR: never

      - name: Copy native libraries to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp engine/target/aarch64-linux-android/release/libeditors_pro_engine.so \
             android/app/src/main/jniLibs/arm64-v8a/
          cp engine/target/x86_64-linux-android/release/libeditors_pro_engine.so \
             android/app/src/main/jniLibs/x86_64/
          cp engine/ffmpeg-android-lgpl/lib/arm64/*.so android/app/src/main/jniLibs/arm64-v8a/
          cp engine/ffmpeg-android-lgpl/lib/amd64/*.so android/app/src/main/jniLibs/x86_64/

      - name: Verify Rust engine links Android FFmpeg
        run: |
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$readelf" -d android/app/src/main/jniLibs/arm64-v8a/libeditors_pro_engine.so \
            | grep -Fq 'Shared library: [libavformat.so]'

      # ── Build Flutter APK ───────────────────────────────────────────
      - name: Build Flutter APK
        shell: bash
        run: |
          build_log="$RUNNER_TEMP/flutter-apk-build.log"
          set +e
          flutter build apk --release --dart-define=FFMPEG_LICENSE_PROFILE=lgpl-2.1 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            diagnostics="$(tail -n 32 "$build_log" | tr '\r\n' ' ' | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g')"
            printf '::error title=Flutter APK build diagnostics::%s\n' "$diagnostics"
            {
              echo '### Flutter APK build diagnostics'
              echo '```text'
              tail -n 48 "$build_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$build_status"
          fi

      # Phase E.3: also build an App Bundle (AAB) for Play Store distribution.
      # The AAB is the required format for new Play Store submissions since
      # August 2021; the APK is still useful for sideloading and testing.
      - name: Build Flutter AAB
        shell: bash
        run: |
          build_log="$RUNNER_TEMP/flutter-aab-build.log"
          set +e
          flutter build appbundle --release --dart-define=FFMPEG_LICENSE_PROFILE=lgpl-2.1 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            diagnostics="$(tail -n 32 "$build_log" | tr '\r\n' ' ' | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g')"
            printf '::error title=Flutter AAB build diagnostics::%s\n' "$diagnostics"
            {
              echo '### Flutter AAB build diagnostics'
              echo '```text'
              tail -n 48 "$build_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$build_status"
          fi

      - name: Verify APK packages Android FFmpeg and excludes FFmpegKit
        run: |
          unzip -Z1 build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/apk-files.txt"
          grep -Fxq 'lib/arm64-v8a/libavcodec.so' "$RUNNER_TEMP/apk-files.txt"
          if grep -q 'libffmpegkit' "$RUNNER_TEMP/apk-files.txt"; then
            echo "Legacy FFmpegKit wrapper unexpectedly packaged" >&2
            exit 1
          fi

      - name: Upload FFmpeg LGPL source and build materials
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-lgpl-source-and-build
          path: |
            engine/ffmpeg-android-lgpl/BUILDINFO.txt
            engine/ffmpeg-android-lgpl/COPYING.LGPLv2.1
            engine/ffmpeg-android-lgpl/lib/arm64/*.so
            engine/ffmpeg-android-lgpl/lib/amd64/*.so
            engine/ffmpeg-android-lgpl/.build/ffmpeg-7.1.5.tar.xz
            engine/ffmpeg-android-lgpl/.build/ffmpeg-7.1.5.tar.xz.asc
            engine/ffmpeg-android-lgpl/.build/ffmpeg-devel.asc
            engine/ffmpeg-android-lgpl/.build/signature-check.txt
          include-hidden-files: true
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: editors-pro-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: editors-pro-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  # ─── Release on Tag ────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-android.outputs.release_signing_configured == 'true'
    needs: [build-android, rust-check, flutter-check]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: editors-pro-android-apk
          path: ./artifacts/

      # Phase E.3: also include the AAB in the release for Play Store uploads.
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: editors-pro-android-aab
          path: ./artifacts/

      - name: Download FFmpeg LGPL source and build materials
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-lgpl-source-and-build
          path: ./artifacts/ffmpeg-lgpl

      - name: Package FFmpeg LGPL corresponding source
        run: |
          cd ./artifacts
          zip -qr editors-pro-ffmpeg-lgpl-source.zip ffmpeg-lgpl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/app-release.apk
            ./artifacts/app-release.aab
            ./artifacts/editors-pro-ffmpeg-lgpl-source.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
