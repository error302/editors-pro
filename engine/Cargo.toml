[package]
name = "editors-pro-engine"
version = "0.1.0"
edition = "2021"
description = "Native Rust engine for EDITORS-PRO mobile video editor"
authors = ["EDITORS-PRO Team"]
license = "Proprietary"

[lib]
name = "editors_pro_engine"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# IDs and timestamps
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"
libc = "0.2"

# Logging
log = "0.4"
env_logger = "0.11"

# Video I/O (FFmpeg 7.x bindings) — optional for dev builds without FFmpeg
ffmpeg-next = { version = "7.1", optional = true }

# Concurrency
rayon = "1.10"

# Image processing (for thumbnail generation)
image = "0.25"

# GPU compute — wgpu for compute shader effects (Vulkan on Android, Metal on iOS)
wgpu = { version = "22.0", features = ["webgpu"] }
pollster = "0.3"

# Crossbeam channels for the dedicated decode thread + push-based frame streaming
crossbeam-channel = "0.5"

# flume channels for async task queue (used by utils/async_ops.rs)
flume = "0.11"

# SQLite bindings for project_store
rusqlite = { version = "0.32", features = ["bundled"] }

# Audio processing (Phase 2+)
# cpal = "0.15"
# rubato = "0.15"

# Font rendering for text overlays
fontdue = "0.9"

# File compression for .epp format
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# CRC32 checksum for .epp format integrity verification
crc32fast = "1.4"

# Memory-aligned data for GPU interop
bytemuck = "1.16"

# once_cell for the global FFI dispatcher Mutex (Phase A.1)
once_cell = "1.20"

# Flutter Rust Bridge (required for StreamSink support in bridge_api.rs)
flutter_rust_bridge = { version = "2.9", features = ["rust-async"] }

# Phase F: base64 for encoding/decoding frames across the FFI boundary
# (used by the pro tools dispatch arms: compute_scopes, legalize_frame,
# estimate_motion, replace_sky, etc.)
base64 = "0.22"

[features]
# Default: include FFmpeg for full functionality
default = ["ffmpeg"]

# FFmpeg feature — enables actual video decode/encode via FFmpeg C libraries
# Disable this for development builds on platforms without FFmpeg installed
ffmpeg = ["dep:ffmpeg-next"]

# Android NDK bindings (for MediaCodec hardware acceleration)
[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.6"
jni = "0.21"

# cbindgen removed — flutter_rust_bridge v2 generates its own bindings.
# See flutter_rust_bridge.yaml for codegen configuration.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
tokio-test = "0.4"
mockall = "0.13"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "engine_benchmarks"
harness = false
path = "benches/engine_benchmarks.rs"
